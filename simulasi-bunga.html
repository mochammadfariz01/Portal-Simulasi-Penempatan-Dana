<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulasi Bunga</title><link rel="stylesheet" href="style.css"></head><body><header class="appbar"><a href="index.html">←</a><div class="brand">BJ</div></header><main class="calc"><h1>Simulasi Bunga</h1><label>Periode</label><input id="period" class="field" type="month" value="2026-06"><label>Nominal</label><div class="row"><input id="nominal" value="125000000"><button onclick="step('nominal',-1000000)">−</button><button onclick="step('nominal',1000000)">+</button></div><label>Tenor Bulan</label><div class="tenors"><button data-m="1">1</button><button class="active" data-m="3">3</button><button data-m="6">6</button><button data-m="12">12</button><button data-m="24">24</button></div><label>Tenor Hari</label><input id="days" class="field" readonly><label>Suku Bunga</label><input id="rate" class="field" readonly><label>Bunga Gross</label><input id="gross" class="field" readonly><label>Pajak</label><input id="tax" class="field" readonly><label>Bunga Net</label><input id="net" class="field" readonly><p class="note">Rate mengikuti tiering nominal, basis 360 hari, pajak 20%.</p></main><footer class="bottom"><a href="index.html">Cancel</a><button onclick="saveCurrent()">Save</button></footer><script src="common.js"></script><script src="simulasi-bunga.js"></script></body></html>
