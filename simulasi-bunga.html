<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simulasi Bunga</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="calc-body">
<header class="topbar">
  <div class="page-wrap topbar-inner">
    <a class="back" href="index.html" aria-label="Kembali">←</a>
    <div class="mini-brand">S</div>
    <div>
      <strong>Portal Simulasi Penempatan Dana</strong>
      <span>Hitung bunga berdasarkan nominal penempatan dan tenor.</span>
    </div>
  </div>
</header>
<main class="page-wrap calc-page">
  <section class="calc-card">
    <div class="calc-title">
      <h1>Simulasi Bunga</h1>
      <p>Hitung bunga berdasarkan nominal penempatan dan tenor.</p>
    </div>
    
    <div class="form-grid">
      <label>Periode Penempatan
        <input id="period" type="month" value="2026-06">
      </label>

      <label>Nominal Penempatan
        <div class="stepper">
          <span>Rp</span><input id="nominal" inputmode="numeric" value="125000000">
          <button type="button" data-step="-1000000">−</button>
          <button type="button" data-step="1000000">+</button>
        </div>
      </label>

      <label>Tenor
        <div class="tenor-row five">
          <button class="tenor" data-month="1">1</button>
          <button class="tenor active" data-month="3">3</button>
          <button class="tenor" data-month="6">6</button>
          <button class="tenor" data-month="12">12</button>
          <button class="tenor" data-month="24">24</button>
        </div>
      </label>

      <label>Tenor Hari
        <input id="days" class="readonly" readonly>
      </label>

      <label>Suku Bunga
        <input id="rate" class="readonly" readonly>
      </label>

      <div class="result-box">
        <span>Bunga Gross</span>
        <strong id="gross"></strong>
      </div>

      <div class="result-box">
        <span>Pajak</span>
        <strong id="tax"></strong>
      </div>

      <div class="result-box accent">
        <span>Bunga Net</span>
        <strong id="net"></strong>
      </div>
    </div>
    <p class="note">Rate mengikuti tiering nominal penempatan. Basis perhitungan 360 hari dan pajak 20%.</p>
    
  </section>
</main>
<script src="assets/common.js"></script>
<script src="assets/simulasi-bunga.js"></script>
</body>
</html>
