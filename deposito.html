<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalkulator Deposito</title><link rel="stylesheet" href="style.css"></head><body><header class="appbar"><a href="index.html">←</a><div class="brand">BJ</div></header><main class="calc"><h1>Kalkulator Deposito</h1><label>Nominal</label><div class="row"><input id="nominal" value="50000000"><button onclick="step('nominal',-1000000)">−</button><button onclick="step('nominal',1000000)">+</button></div><label>Bunga (% p.a.)</label><input id="rate" class="field" type="number" value="3"><label>Tenor Hari</label><input id="days" class="field" type="number" value="30"><label>Bunga Bersih</label><input id="net" class="field" readonly><label>Total Akhir</label><input id="total" class="field" readonly></main><footer class="bottom"><a href="index.html">Cancel</a><button onclick="saveCurrent()">Save</button></footer><script src="common.js"></script><script>['nominal','rate','days'].forEach(i=>document.getElementById(i).oninput=calc);function calc(){let x=n('nominal'),r=+rate.value||0,d=+days.value||0,b=x*r/100*d/365*.8;net.value=rp(b);total.value=rp(x+b)}calc()</script></body></html>
