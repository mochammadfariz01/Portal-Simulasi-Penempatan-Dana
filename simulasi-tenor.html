<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulasi Tenor</title><link rel="stylesheet" href="style.css"></head><body><header class="appbar"><a href="index.html">←</a><div class="brand">BJ</div></header><main class="calc"><h1>Simulasi Tenor</h1><label>Nominal</label><div class="row"><input id="nominal" value="9240000000"><button onclick="step('nominal',-1000000)">−</button><button onclick="step('nominal',1000000)">+</button></div><label>Suku Bunga (% p.a.)</label><div class="row"><input id="rate" type="number" value="4.5" step="0.25"><button onclick="rate.value=Math.max(.25,+rate.value-.25);calc()">−</button><button onclick="rate.value=+rate.value+.25;calc()">+</button></div><label>Target Bunga Net</label><div class="row"><input id="target" value="25000000000"><button onclick="step('target',-1000000)">−</button><button onclick="step('target',1000000)">+</button></div><label>Bunga Gross</label><input id="gross" class="field" readonly><label>Pajak</label><input id="tax" class="field" readonly><label>Bunga Net</label><input id="net" class="field" readonly><label>Estimasi Tenor Program</label><input id="monthsOut" class="field" readonly><label>Estimasi Hari</label><input id="daysOut" class="field" readonly></main><footer class="bottom"><a href="index.html">Cancel</a><button onclick="saveCurrent()">Save</button></footer><script src="common.js"></script><script src="simulasi-tenor.js"></script></body></html>
