<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulasi Nominal</title><link rel="stylesheet" href="style.css"></head><body><header class="appbar"><a href="index.html">←</a><div class="brand">BJ</div></header><main class="calc"><h1>Simulasi Nominal</h1><label>Periode</label><input id="period" class="field" type="month" value="2026-08"><label>Target Bunga Net</label><div class="row"><input id="target" value="35000000"><button onclick="step('target',-1000000)">−</button><button onclick="step('target',1000000)">+</button></div><label>Tenor Bulan</label><div class="tenors"><button data-m="1">1</button><button class="active" data-m="3">3</button><button data-m="6">6</button><button data-m="12">12</button><button data-m="24">24</button></div><label>Tenor Hari</label><input id="days" class="field" readonly><label>Suku Bunga (% p.a.)</label><div class="row"><input id="rate" type="number" value="6" step="0.25"><button onclick="rate.value=Math.max(.25,+rate.value-.25);calc()">−</button><button onclick="rate.value=+rate.value+.25;calc()">+</button></div><label>Nominal Penempatan</label><input id="placement" class="field" readonly><label>Bunga Gross</label><input id="gross" class="field" readonly><label>Pajak</label><input id="tax" class="field" readonly><label>Bunga Net</label><input id="net" class="field" readonly></main><footer class="bottom"><a href="index.html">Cancel</a><button onclick="saveCurrent()">Save</button></footer><script src="common.js"></script><script src="simulasi-nominal.js"></script></body></html>
